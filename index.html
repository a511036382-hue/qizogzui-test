<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="description" content="七宗罪人格测试 · Seven Deadly Sins Personality Test">
<title>七宗罪人格测试 · 你的暗黑人格档案</title>
<style>
/* ============================================================
   七宗罪人格测试 · 样式表
   暗黑心理档案风 / 移动端优先 / 390×844 设计基准
   ============================================================ */

:root{
  --bg:#090909;
  --card:#111111;
  --card2:#161513;
  --gold:#D6B36A;
  --gold-2:#F0DCA8;
  --red:#9B2335;
  --red-2:#C0392B;
  --text:#EDE7DE;
  --muted:#8B8377;
  --line:rgba(214,179,106,.16);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
img{display:block;max-width:100%;}

/* ---------- 应用容器 ---------- */
.app{
  position:relative;
  width:100%;
  max-width:480px;
  height:100vh;
  height:100dvh;
  margin:0 auto;
  overflow:hidden;
  background:var(--bg);
}
.screen{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
}
.screen.active{display:flex;}
.scroll-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.scroll-area::-webkit-scrollbar{width:0;}

/* ---------- 通用按钮 ---------- */
.btn-primary{
  display:block;
  width:100%;
  padding:16px;
  border-radius:999px;
  font-size:16px;
  font-weight:600;
  letter-spacing:2px;
  color:#1A1207;
  background:linear-gradient(135deg,#F0DCA8 0%,#D6B36A 45%,#B7913F 100%);
  box-shadow:0 8px 26px -8px rgba(214,179,106,.65),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .18s ease,box-shadow .18s ease;
}
.btn-primary:active{transform:scale(.975);box-shadow:0 4px 14px -6px rgba(214,179,106,.5);}
.btn-ghost{
  display:block;
  width:100%;
  padding:15px;
  border-radius:999px;
  font-size:15px;
  letter-spacing:1px;
  color:var(--muted);
  border:1px solid rgba(214,179,106,.24);
  background:rgba(255,255,255,.015);
  transition:transform .18s ease,color .18s ease,border-color .18s ease;
}
.btn-ghost:active{transform:scale(.975);color:var(--gold);border-color:rgba(214,179,106,.5);}
.btn-primary.sm,.btn-ghost.sm{padding:13px;font-size:14px;width:auto;flex:1;}

/* ---------- 首页 ---------- */
.home-inner{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:100%;
  padding:48px 26px 34px;
  position:relative;
}
.home-glow{
  position:absolute;
  top:-140px;left:50%;
  transform:translateX(-50%);
  width:360px;height:360px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(155,35,53,.42) 0%,rgba(155,35,53,.10) 45%,transparent 72%);
  filter:blur(14px);
  pointer-events:none;
}
.home-main{position:relative;z-index:2;}
.home-emblem{
  width:88px;height:88px;
  margin:0 auto 30px;
  border-radius:50%;
  border:1px solid rgba(214,179,106,.42);
  background:radial-gradient(circle,rgba(214,179,106,.10),transparent 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,"Times New Roman",serif;
  font-size:30px;
  letter-spacing:2px;
  color:var(--gold);
  box-shadow:0 0 40px -8px rgba(214,179,106,.35),inset 0 0 22px -10px rgba(214,179,106,.6);
}
.home-title{
  text-align:center;
  font-size:38px;
  font-weight:800;
  letter-spacing:5px;
  color:var(--gold);
  text-shadow:0 0 32px rgba(214,179,106,.35);
  line-height:1.15;
}
.home-title span{
  display:block;
  margin-top:10px;
  font-size:14px;
  font-weight:400;
  letter-spacing:11px;
  text-indent:11px;
  color:var(--text);
  opacity:.82;
  text-shadow:none;
}
.home-en{
  text-align:center;
  margin-top:12px;
  font-size:10px;
  letter-spacing:2.4px;
  color:var(--muted);
  text-transform:uppercase;
}
.home-rule{
  display:flex;align-items:center;justify-content:center;
  gap:10px;margin:26px 0;
}
.home-rule i{display:block;width:52px;height:1px;background:linear-gradient(90deg,transparent,rgba(214,179,106,.7),transparent);}
.home-rule b{font-size:8px;color:var(--red-2);}
.home-desc{
  text-align:center;
  font-size:13.5px;
  line-height:2;
  color:var(--muted);
}
.home-stats{
  display:flex;
  margin:30px 0 34px;
  border:1px solid var(--line);
  border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
  overflow:hidden;
}
.home-stats>div{
  flex:1;text-align:center;padding:16px 4px;position:relative;
}
.home-stats>div+div::before{
  content:"";position:absolute;left:0;top:22%;height:56%;width:1px;background:var(--line);
}
.home-stats strong{
  display:block;font-size:22px;color:var(--gold);font-weight:700;letter-spacing:.5px;
}
.home-stats span{display:block;margin-top:5px;font-size:11px;color:var(--muted);letter-spacing:1px;}
.home-actions{display:flex;flex-direction:column;gap:12px;}
.home-foot{
  position:relative;z-index:2;
  margin-top:32px;
  text-align:center;
  font-size:10.5px;
  line-height:1.9;
  color:#4C4741;
  letter-spacing:.4px;
}

/* ---------- 答题页头部 ---------- */
.q-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 10px;
  padding-top:calc(16px + env(safe-area-inset-top));
  flex-shrink:0;
}
.icon-btn{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  font-size:15px;
  color:var(--muted);
  border:1px solid rgba(255,255,255,.07);
  transition:color .2s,border-color .2s;
}
.icon-btn:active{color:var(--gold);border-color:rgba(214,179,106,.4);}
.q-counter{
  font-size:12.5px;
  letter-spacing:1.6px;
  color:var(--muted);
}
.q-counter b{color:var(--gold);font-size:16px;font-weight:700;letter-spacing:0;}
.nav-trigger{
  padding:7px 14px;
  border-radius:999px;
  font-size:12px;
  letter-spacing:1.6px;
  color:var(--gold);
  border:1px solid rgba(214,179,106,.36);
  background:rgba(214,179,106,.06);
  transition:transform .18s;
}
.nav-trigger:active{transform:scale(.94);}

/* 进度条 */
.q-progress{
  height:2px;
  margin:0 18px;
  background:rgba(255,255,255,.06);
  border-radius:2px;
  overflow:hidden;
  flex-shrink:0;
}
.q-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--red),var(--gold));
  border-radius:2px;
  transition:width .45s cubic-bezier(.22,.9,.28,1);
}

/* 题目主体 */
.q-body{
  padding:26px 22px 40px;
  display:flex;
  flex-direction:column;
}
.q-card{
  background:linear-gradient(165deg,#141312 0%,#0E0E0E 100%);
  border:1px solid rgba(214,179,106,.13);
  border-radius:22px;
  padding:26px 20px 24px;
  position:relative;
  box-shadow:0 22px 48px -26px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.03);
  animation:cardIn .42s cubic-bezier(.22,.9,.28,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(14px) scale(.985);}
  to{opacity:1;transform:none;}
}
.q-card::before{
  content:"";position:absolute;top:0;left:26px;right:26px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(214,179,106,.55),transparent);
}
.q-tag{
  font-size:10px;
  letter-spacing:3px;
  color:var(--red-2);
  text-transform:uppercase;
  margin-bottom:14px;
  font-weight:600;
}
.q-text{
  font-size:19px;
  line-height:1.72;
  font-weight:600;
  letter-spacing:.6px;
  color:var(--text);
  margin-bottom:24px;
  min-height:66px;
}
.q-options{display:flex;flex-direction:column;gap:9px;}
.opt{
  display:flex;align-items:center;gap:12px;
  padding:14px 15px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.017);
  transition:border-color .2s,background .2s,transform .14s;
  user-select:none;
}
.opt:active{transform:scale(.985);}
.opt-idx{
  flex-shrink:0;
  width:24px;height:24px;
  border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  background:rgba(255,255,255,.05);
  transition:all .2s;
}
.opt-label{
  font-size:14px;
  color:#C9C2B8;
  letter-spacing:.5px;
  transition:color .2s;
}
.opt.selected{
  border-color:rgba(214,179,106,.75);
  background:linear-gradient(90deg,rgba(155,35,53,.30),rgba(214,179,106,.10));
  box-shadow:0 0 22px -8px rgba(214,179,106,.5);
}
.opt.selected .opt-idx{
  background:linear-gradient(135deg,var(--gold),#B7913F);
  color:#1A1207;
}
.opt.selected .opt-label{color:#FFF4DC;font-weight:600;}
.q-hint{
  margin-top:20px;
  text-align:center;
  font-size:11px;
  letter-spacing:1.4px;
  color:#4E4943;
}

/* ---------- 题目导航面板 ---------- */
.panel-mask{
  position:absolute;inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;
  transition:opacity .28s,visibility .28s;
  z-index:40;
}
.panel-mask.show{opacity:1;visibility:visible;}
.panel{
  position:absolute;
  left:0;right:0;bottom:0;
  max-height:78%;
  background:#0D0D0D;
  border-top:1px solid rgba(214,179,106,.3);
  border-radius:26px 26px 0 0;
  padding:20px 20px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(102%);
  transition:transform .34s cubic-bezier(.22,.9,.28,1);
  z-index:50;
  display:flex;
  flex-direction:column;
  box-shadow:0 -20px 50px -20px rgba(0,0,0,.95);
}
.panel.show{transform:translateY(0);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-head h3{font-size:15px;letter-spacing:3px;color:var(--gold);font-weight:600;}
.panel-legend{
  display:flex;gap:16px;
  font-size:10.5px;color:var(--muted);
  margin-bottom:16px;letter-spacing:.5px;
}
.panel-legend span{display:flex;align-items:center;gap:5px;}
.ld{width:8px;height:8px;border-radius:50%;display:block;}
.ld.done{background:var(--gold);}
.ld.current{background:var(--red-2);box-shadow:0 0 8px var(--red-2);}
.ld.todo{background:#2E2C29;}
.nav-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:11px;
  overflow-y:auto;
  padding:4px 2px 10px;
}
.nav-grid::-webkit-scrollbar{width:0;}
.nav-item{
  aspect-ratio:1;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;
  font-weight:600;
  color:#6B655D;
  background:#181716;
  border:1px solid rgba(255,255,255,.05);
  transition:transform .14s,box-shadow .2s;
}
.nav-item:active{transform:scale(.9);}
.nav-item.done{
  color:#1A1207;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));
  border-color:transparent;
  box-shadow:0 3px 12px -4px rgba(214,179,106,.7);
}
.nav-item.current{
  color:#FFF;
  background:linear-gradient(135deg,var(--red-2),var(--red));
  border-color:rgba(255,120,120,.5);
  box-shadow:0 0 0 2px rgba(192,57,43,.28),0 4px 16px -4px rgba(192,57,43,.9);
}
.panel-foot{
  padding-top:14px;
  margin-top:4px;
  border-top:1px solid rgba(255,255,255,.06);
  text-align:center;
  font-size:11.5px;
  letter-spacing:1.6px;
  color:var(--muted);
}
.panel-foot b{color:var(--gold);}

/* ---------- 弹窗 ---------- */
.modal{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:28px;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  opacity:0;visibility:hidden;
  transition:opacity .26s,visibility .26s;
  z-index:60;
}
.modal.show{opacity:1;visibility:visible;}
.modal-box{
  width:100%;
  max-width:330px;
  background:linear-gradient(170deg,#151413,#0C0C0C);
  border:1px solid rgba(214,179,106,.26);
  border-radius:24px;
  padding:30px 22px 24px;
  text-align:center;
  position:relative;
  transform:translateY(16px) scale(.96);
  transition:transform .32s cubic-bezier(.22,.9,.28,1);
  box-shadow:0 30px 70px -30px rgba(0,0,0,1);
}
.modal.show .modal-box{transform:none;}
.modal-box::before{
  content:"";position:absolute;top:0;left:24px;right:24px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(214,179,106,.6),transparent);
}
.modal-icon{
  width:46px;height:46px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;
  color:var(--red-2);
  border:1px solid rgba(192,57,43,.5);
  background:rgba(155,35,53,.14);
  box-shadow:0 0 26px -6px rgba(192,57,43,.7);
}
.modal-seal{
  width:56px;height:56px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;
  font-size:20px;
  letter-spacing:1px;
  color:var(--gold);
  border:1px solid rgba(214,179,106,.45);
  background:radial-gradient(circle,rgba(214,179,106,.12),transparent 70%);
  box-shadow:0 0 30px -8px rgba(214,179,106,.6);
}
.modal-box h3{
  font-size:16.5px;
  line-height:1.6;
  letter-spacing:.8px;
  color:var(--text);
  font-weight:700;
  margin-bottom:8px;
}
.modal-box h3 em{color:var(--red-2);font-style:normal;font-size:20px;}
.modal-sub{
  font-size:11.5px;color:var(--muted);letter-spacing:2px;margin-bottom:14px;
}
.modal-text{
  font-size:13px;line-height:2;color:var(--muted);margin-bottom:24px;letter-spacing:.5px;
}
.missing-tags{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin-bottom:24px;
  max-height:130px;overflow-y:auto;
}
.missing-tags span{
  min-width:38px;
  padding:6px 11px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:600;
  color:var(--gold);
  background:rgba(214,179,106,.09);
  border:1px solid rgba(214,179,106,.3);
}
.modal-box .btn-primary{margin-bottom:10px;}

/* ---------- 结果页 ---------- */
#screen-result{background:var(--bg);}
#result-scroll{padding:0 0 24px;}
.result-bar{
  flex-shrink:0;
  display:flex;gap:11px;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(9,9,9,0),rgba(9,9,9,.96) 38%);
  border-top:1px solid rgba(214,179,106,.12);
}

/* 结果头部 */
.res-head{
  position:relative;
  padding:44px 24px 34px;
  text-align:center;
  overflow:hidden;
}
.res-head::after{
  content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);
  width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(155,35,53,.45),transparent 68%);
  filter:blur(22px);pointer-events:none;
}
.res-badge{
  position:relative;z-index:2;
  width:74px;height:74px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;
  font-size:24px;letter-spacing:1px;
  color:var(--gold);
  border:1px solid rgba(214,179,106,.45);
  background:radial-gradient(circle,rgba(214,179,106,.12),transparent 70%);
  box-shadow:0 0 44px -10px rgba(214,179,106,.75);
  animation:sealIn .8s cubic-bezier(.22,.9,.28,1) both;
}
@keyframes sealIn{
  from{opacity:0;transform:scale(.6) rotate(-25deg);}
  to{opacity:1;transform:none;}
}
.res-eyebrow{
  position:relative;z-index:2;
  font-size:10.5px;letter-spacing:4px;color:var(--muted);
  margin-bottom:12px;
}
.res-name{
  position:relative;z-index:2;
  font-size:31px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--gold);
  text-shadow:0 0 34px rgba(214,179,106,.4);
  line-height:1.25;
}
.res-en{
  position:relative;z-index:2;
  margin-top:10px;
  font-size:10px;
  letter-spacing:3px;
  color:var(--red-2);
  text-transform:uppercase;
  font-weight:600;
}
.res-tags{
  position:relative;z-index:2;
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  margin-top:20px;
}
.res-tags span{
  padding:6px 13px;
  border-radius:999px;
  font-size:11.5px;
  letter-spacing:.6px;
  color:var(--gold);
  background:rgba(214,179,106,.07);
  border:1px solid rgba(214,179,106,.28);
}

/* 区块 */
.block{
  margin:0 18px 16px;
  background:linear-gradient(168deg,#131211 0%,#0D0D0D 100%);
  border:1px solid rgba(214,179,106,.13);
  border-radius:20px;
  padding:22px 18px;
  position:relative;
  box-shadow:0 20px 44px -30px rgba(0,0,0,1);
}
.block::before{
  content:"";position:absolute;top:0;left:22px;right:22px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(214,179,106,.4),transparent);
}
.sec-title{
  display:flex;align-items:center;justify-content:center;
  gap:12px;margin-bottom:20px;
}
.sec-title i{
  display:block;width:38px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(214,179,106,.6));
}
.sec-title i:last-child{background:linear-gradient(90deg,rgba(214,179,106,.6),transparent);}
.sec-title h3{
  font-size:14px;
  letter-spacing:3.5px;
  color:var(--gold);
  font-weight:600;
  white-space:nowrap;
}
.sec-title h3::before{content:"— ";opacity:.5;}
.sec-title h3::after{content:" —";opacity:.5;}

/* 洞察总结 */
.insight-text{
  font-size:13.5px;
  line-height:2.15;
  color:#B9B2A8;
  letter-spacing:.5px;
  text-align:justify;
}
.insight-text b{color:var(--gold);font-weight:700;}
.insight-text em{color:var(--red-2);font-style:normal;font-weight:600;}

/* 雷达图 */
.radar-wrap{
  display:flex;justify-content:center;
  margin:-6px 0 4px;
}
#radar{width:100%;height:302px;display:block;}

/* 维度排行 */
.rank-row{
  display:flex;align-items:center;gap:11px;
  padding:9px 0;
}
.rank-badge{
  flex-shrink:0;
  width:30px;height:30px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.5px;
  color:var(--gold);
  border:1px solid rgba(214,179,106,.4);
  background:rgba(214,179,106,.07);
}
.rank-name{
  flex-shrink:0;
  width:38px;
  font-size:13.5px;
  font-weight:600;
  color:#D6CFC5;
  letter-spacing:1px;
}
.rank-track{
  flex:1;
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.055);
  overflow:hidden;
}
.rank-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--red),#C97A6A 55%,var(--gold));
  width:0;
  transition:width 1s cubic-bezier(.22,.9,.28,1);
  box-shadow:0 0 12px -2px rgba(214,179,106,.55);
}

/* ---------------- 2. 状态管理 ---------------- */

const STORAGE_KEY = 'seven_sins_test_v1';
const state = { answers:{}, current:0 };

// 读取本地进度
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object'){
      state.answers = parsed.answers || {};
      state.current = typeof parsed.current === 'number' ? parsed.current : 0;
    }
  }catch(e){ /* 忽略解析错误 */ }
}

// 写入本地进度
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answers: state.answers,
      current: state.current
    }));
  }catch(e){ /* 存储不可用时静默失败 */ }
}

// 清空进度
function clearState(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state.answers = {};
  state.current = 0;
}

/* ---------------- 3. 工具函数 ---------------- */

const $ = id => document.getElementById(id);

function answeredCount(){
  return QUESTIONS.filter(q => typeof state.answers[q.id] === 'number').length;
}
function allAnswered(){
  return answeredCount() === QUESTIONS.length;
}
function missingList(){
  return QUESTIONS.filter(q => typeof state.answers[q.id] !== 'number');
}
// 从 fromIndex 开始找第一道未答题
function findNextUnanswered(fromIndex){
  for(let i = fromIndex; i < QUESTIONS.length; i++){
    if(typeof state.answers[QUESTIONS[i].id] !== 'number') return i;
  }
  return -1;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ---------------- 4. 首页逻辑 ---------------- */

function refreshHome(){
  const startBtn = $('btn-start');
  const restartBtn = $('btn-restart');
  const done = answeredCount();

  if(done === 0){
    startBtn.textContent = '开始测试';
    restartBtn.hidden = true;
  }else if(done === QUESTIONS.length){
    startBtn.textContent = '查看我的报告';
    restartBtn.hidden = false;
  }else{
    startBtn.textContent = '继续测试';
    restartBtn.hidden = false;
  }
}

$('btn-start').addEventListener('click', () => {
  if(allAnswered()){
    renderResult();
    return;
  }
  let idx;
  if(answeredCount() === 0){
    idx = 0;
  }else{
    idx = findNextUnanswered(0);
    if(idx === -1) idx = state.current;
  }
  goTo(idx, false);
  showScreen('screen-quiz');
});

$('btn-restart').addEventListener('click', () => {
  clearState();
  refreshHome();
});

/* ---------------- 5. 答题页逻辑 ---------------- */

let optionLock = false;   // 防止连点
let navJumped = false;    // 是否由导航面板跳转而来

function goTo(index, fromNav){
  index = Math.max(0, Math.min(QUESTIONS.length - 1, index));
  state.current = index;
  saveState();
  navJumped = !!fromNav;
  renderQuestion();
  renderNav();
}

function renderQuestion(){
  const idx = state.current;
  const q = QUESTIONS[idx];
  const saved = state.answers[q.id];

  $('q-counter').innerHTML = '第 <b>' + (idx + 1) + '</b> 题 / 共 ' + QUESTIONS.length + ' 题';
  $('q-tag').textContent = 'QUESTION ' + String(idx + 1).padStart(2, '0');
  $('q-text').textContent = q.text;

  // 重新播放卡片入场动画
  const card = $('q-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  // 选项
  const wrap = $('q-options');
  wrap.innerHTML = '';
  OPTION_LABELS.forEach((label, i) => {
    const value = i + 1;
    const el = document.createElement('div');
    el.className = 'opt' + (saved === value ? ' selected' : '');
    el.innerHTML = '<span class="opt-idx">' + value + '</span><span class="opt-label">' + label + '</span>';
    el.addEventListener('click', () => selectOption(value, el));
    wrap.appendChild(el);
  });

  // 进度条
  const pct = (answeredCount() / QUESTIONS.length) * 100;
  $('q-progress-fill').style.width = pct + '%';

  // 滚动回顶部
  $('q-body').scrollTop = 0;
}

function selectOption(value, el){
  if(optionLock) return;
  optionLock = true;

  const q = QUESTIONS[state.current];
  state.answers[q.id] = value;
  saveState();

  // 视觉反馈
  const siblings = el.parentNode.querySelectorAll('.opt');
  siblings.forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');

  // 进度条更新
  $('q-progress-fill').style.width = (answeredCount() / QUESTIONS.length) * 100 + '%';

  // 保存后自动跳转
  setTimeout(() => {
    optionLock = false;
    advance(state.current, navJumped);
    navJumped = false;
  }, 360);
}

// 答题后的推进逻辑
function advance(fromIndex, fromNav){
  // 若由导航面板跳转来修改答案，则停留当前页，不打断用户
  if(fromNav){
    renderNav();
    return;
  }

  const next = findNextUnanswered(fromIndex + 1);
  if(next !== -1){
    goTo(next, false);
    return;
  }

  // 后面已无未答题
  if(allAnswered()){
    openModal('modal-confirm');
  }else{
    // 前方仍有漏题
    openMissingModal();
  }
}

/* ---------------- 6. 题目导航面板 ---------------- */

function renderNav(){
  const grid = $('nav-grid');
  grid.innerHTML = '';
  const cur = state.current;

  QUESTIONS.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.textContent = i + 1;
    if(i === cur) btn.classList.add('current');
    else if(typeof state.answers[q.id] === 'number') btn.classList.add('done');

    btn.addEventListener('click', () => {
      closeNav();
      goTo(i, true);
    });
    grid.appendChild(btn);
  });

  $('panel-foot').innerHTML = '已完成 <b>' + answeredCount() + '</b> / ' + QUESTIONS.length;
}

function openNav(){
  renderNav();
  $('panel-mask').classList.add('show');
  $('nav-panel').classList.add('show');
}
function closeNav(){
  $('panel-mask').classList.remove('show');
  $('nav-panel').classList.remove('show');
}

$('btn-open-nav').addEventListener('click', openNav);
$('btn-close-nav').addEventListener('click', closeNav);
$('panel-mask').addEventListener('click', closeNav);

/* ---------------- 7. 弹窗逻辑 ---------------- */

function openModal(id){
  $(id).classList.add('show');
}
function closeModal(id){
  $(id).classList.remove('show');
}

// 漏题弹窗
function openMissingModal(){
  const missing = missingList();
  $('missing-count').textContent = missing.length;
  const tags = $('missing-tags');
  tags.innerHTML = '';
  missing.forEach(q => {
    const s = document.createElement('span');
    s.textContent = q.id;
    tags.appendChild(s);
  });
  openModal('modal-missing');
}

$('btn-continue-missing').addEventListener('click', () => {
  closeModal('modal-missing');
  const missing = missingList();
  if(missing.length === 0){
    openModal('modal-confirm');
    return;
  }
  const firstIdx = QUESTIONS.findIndex(q => q.id === missing[0].id);
  showScreen('screen-quiz');
  goTo(firstIdx, false);
});

// 完成确认弹窗
$('btn-view-report').addEventListener('click', () => {
  closeModal('modal-confirm');
  renderResult();
});

$('btn-check-again').addEventListener('click', () => {
  closeModal('modal-confirm');
  // 回到第 1 题，方便检查
  showScreen('screen-quiz');
  goTo(0, true);
});

/* ---------------- 8. 退出 / 回看 ---------------- */

$('btn-quit').addEventListener('click', () => {
  showScreen('screen-home');
  refreshHome();
});

$('btn-review').addEventListener('click', () => {
  showScreen('screen-quiz');
  goTo(0, true);
});

$('btn-retest').addEventListener('click', () => {
  clearState();
  showScreen('screen-home');
  refreshHome();
});

/* ---------------- 9. 计分与结果计算 ---------------- */

function computeScores(){
  const raw = {}, count = {};
  Object.keys(DIMS).forEach(k => { raw[k] = 0; count[k] = 0; });

  QUESTIONS.forEach(q => {
    const v = state.answers[q.id];
    raw[q.dim] += (typeof v === 'number' ? v : 0);
    count[q.dim] += 1;
  });

  const pct = {};
  Object.keys(DIMS).forEach(k => {
    const min = count[k] * 1;
    const max = count[k] * 6;
    const v = (raw[k] - min) / (max - min) * 100;
    pct[k] = Math.max(0, Math.min(100, Math.round(v)));
  });
  return pct;
}

// 触发因素矩阵（由维度分加权得出）
function computeFactors(p){
  const list = [
    { name:'自尊敏感', desc:'衡量被低估、被比较或被忽视时的内在波动。',
      v: p.pride * 0.6 + p.envy * 0.4 },
    { name:'欲望牵引', desc:'衡量新鲜感、获得感和即时满足对你的拉力。',
      v: p.gluttony * 0.4 + p.lust * 0.35 + p.greed * 0.25 },
    { name:'情绪升温', desc:'衡量被冒犯、受阻或不平衡时的升温速度。',
      v: p.wrath * 0.65 + p.pride * 0.2 + p.envy * 0.15 },
    { name:'回避惯性', desc:'衡量压力来临时用拖延、沉浸或模糊处理的倾向。',
      v: p.sloth * 0.7 + p.gluttony * 0.3 }
  ];
  list.forEach(item => {
    item.dots = Math.max(1, Math.min(5, Math.round(item.v / 20)));
  });
  return list;
}

    html +=   '<p class="factor-desc">' + f.desc + '</p>';
    html += '</div>';
  });
  html += '</div>';

  /* --- 优势 --- */
  html += '<div class="block">';
  html +=   '<div class="sec-title"><i></i><h3>人格优势</h3><i></i></div>';
  main.strengths.forEach(s => {
    html += '<div class="list-item"><span class="dot dot-gold"></span><span>' + s + '</span></div>';
  });
  html += '</div>';

  /* --- 弱点 --- */
  html += '<div class="block">';
  html +=   '<div class="sec-title"><i></i><h3>隐藏弱点</h3><i></i></div>';
  main.weaknesses.forEach(s => {
    html += '<div class="list-item"><span class="dot dot-red"></span><span>' + s + '</span></div>';
  });
  html += '</div>';

  /* --- 触发场景 --- */
  html += '<div class="block">';
  html +=   '<div class="sec-title"><i></i><h3>高敏感触发场景</h3><i></i></div>';
  html +=   '<div class="chips">' + main.triggers.map(t => '<span>' + t + '</span>').join('') + '</div>';
  html += '</div>';

  /* --- 成长建议 --- */
  html += '<div class="block">';
  html +=   '<div class="sec-title"><i></i><h3>平衡建议</h3><i></i></div>';
  main.advice.forEach((a, i) => {
    html += '<div class="advice">';
    html +=   '<span class="advice-num">' + (i + 1) + '</span>';
    html +=   '<p>' + a + '</p>';
    html += '</div>';
  });
  html += '</div>';

  /* --- 结语 --- */
  html += '<div class="res-end">';
  html +=   '<div class="line"></div>';
  html +=   '<p>七宗罪不是判决书，是一份关于你的使用说明。<br>看见它，才有机会不再被它推着走。</p>';
  html +=   '<p class="res-share">长按截图 · 保存你的暗黑人格档案</p>';
  html += '</div>';

  scroll.innerHTML = html;

  showScreen('screen-result');
  scroll.scrollTop = 0;

  // 进度条动画 + 雷达图绘制（等 DOM 渲染完成）
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('.rank-fill').forEach(el => {
        el.style.width = el.dataset.w + '%';
      });
      drawRadar(pct);
    });
  });
}

/* ---------------- 11. Canvas 雷达图 ---------------- */

function drawRadar(pct){
  const canvas = $('radar');
  if(!canvas) return;

  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  if(w === 0 || h === 0) return;

  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const R = Math.min(w, h) / 2 - 46;
  const N = RADAR_ORDER.length;
  const step = Math.PI * 2 / N;
  const start = -Math.PI / 2;

  const angleOf = i => start + i * step;

  /* --- 网格层 --- */
  const LEVELS = 4;
  for(let lv = LEVELS; lv >= 1; lv--){
    const r = R * lv / LEVELS;
    ctx.beginPath();
    for(let i = 0; i < N; i++){
      const a = angleOf(i);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = lv === LEVELS ? 'rgba(214,179,106,0.32)' : 'rgba(214,179,106,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 最内层加一点暗红底
    if(lv === 1){
      ctx.fillStyle = 'rgba(155,35,53,0.06)';
      ctx.fill();
    }
  }

  /* --- 轴线 --- */
  ctx.strokeStyle = 'rgba(214,179,106,0.14)';
  ctx.lineWidth = 1;
  for(let i = 0; i < N; i++){
    const a = angleOf(i);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.stroke();
  }

  /* --- 数据多边形 --- */
  const points = RADAR_ORDER.map((key, i) => {
    const a = angleOf(i);
    const val = Math.max(4, pct[key]) / 100;   // 最小留一点，避免塌到中心
    return {
      x: cx + Math.cos(a) * R * val,
      y: cy + Math.sin(a) * R * val
    };
  });

  // 填充
  ctx.beginPath();
  points.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
  ctx.closePath();

  const grad = ctx.createRadialGradient(cx, cy, 6, cx, cy, R);
  grad.addColorStop(0, 'rgba(155,35,53,0.72)');
  grad.addColorStop(1, 'rgba(155,35,53,0.34)');
  ctx.fillStyle = grad;
  ctx.fill();

  // 描边
  ctx.strokeStyle = 'rgba(214,179,106,0.95)';
  ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(214,179,106,0.5)';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 顶点
  points.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#F3E3BC';
    ctx.fill();
    ctx.strokeStyle = 'rgba(155,35,53,0.9)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  });

  /* --- 轴标签 --- */
  ctx.font = '600 12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  RADAR_ORDER.forEach((key, i) => {
    const a = angleOf(i);
    const lx = cx + Math.cos(a) * (R + 24);
    const ly = cy + Math.sin(a) * (R + 22);

    // 高亮主维度
    const isTop = pct[key] === Math.max.apply(null, RADAR_ORDER.map(k => pct[k]));
    ctx.fillStyle = isTop ? '#D6B36A' : 'rgba(237,231,222,0.62)';
    ctx.fillText(DIMS[key].cn, lx, ly);
  });
}

/* ---------------- 12. 启动 ---------------- */

(function init(){
  loadState();
  refreshHome();

  // 若上次停在答题中途，首页按钮文案已经处理
  window.addEventListener('resize', () => {
    if($('screen-result').classList.contains('active')){
      const pct = computeScores();
      drawRadar(pct);
    }
  });
})();
</script>
